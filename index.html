
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CarryBee Merchant Registration</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f5f7;
      margin: 0;
      padding: 30px 16px;
      color: #222;
    }
    main {
      max-width: 440px;
      margin: 30px auto;
      padding: 24px;
      background: white;
      border-radius: 12px;
    }
    label {
      display: block;
      margin: 18px 0 6px;
      font-weight: bold;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 6px;
    }
    input {
      border: 1px solid #bbb;
    }
    button {
      margin-top: 22px;
      background: #1769d2;
      color: white;
      border: 0;
      cursor: pointer;
    }
    button:disabled {
      opacity: .6;
    }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
<main>
  <h1>Merchant Registration</h1>

  <form id="form">
    <label for="name">Full name</label>
    <input id="name" name="name" maxlength="150"
           autocomplete="name" required>

    <label for="num">Phone number</label>
    <input id="num" name="num" type="tel" maxlength="30"
           autocomplete="tel" required>

  
<label for="business_name">Business name</label>
<input
    id="business_name"
    name="business_name"
    type="text"
    minlength="3"
    maxlength="50"
    required
    autocomplete="organization"
>


    <button id="submit" type="submit">Register</button>
  </form>

  <pre id="result" aria-live="polite"></pre>
</main>

<script>
const form = document.getElementById('form');
const button = document.getElementById('submit');
const result = document.getElementById('result');

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  button.disabled = true;
  result.textContent = 'Submitting...';

  try {
    const response = await fetch('/api/register.php', {
      method: 'POST',
      body: new FormData(form)
    });

    const text = await response.text();
    let data;

    try {
      data = JSON.parse(text);
    } catch {
      throw new Error('Invalid server response. Check deployment logs.');
    }

    result.textContent = JSON.stringify(data, null, 2);

    if (response.ok) {
      form.reset();
    } else {
      result.textContent =
        'Request failed (HTTP ' + response.status + '):\n' +
        JSON.stringify(data, null, 2);
    }
  } catch (error) {
    result.textContent = error.message || 'Request failed.';
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
